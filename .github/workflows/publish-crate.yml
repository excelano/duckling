name: Publish to crates.io

# Fires on the version tag the release pushes, and can be run by hand.
# `cargo publish` compiles and uploads from source, independent of the .deb;
# the tag is pushed before the GitHub release exists, so the crate lands first.
# It publishes as `duckling-converter`, the crate coordinate alone; the binary,
# the Debian package and the Store identity are `duckling`. Cargo.toml says why.
# The step is token-gated and skips cleanly without a CRATES_IO_TOKEN secret.
# Versions on crates.io are immutable: a bad one is yanked and the fix is the
# next number.
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for a crates.io token
        id: token
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: echo "present=${CRATES_IO_TOKEN:+true}" >> "$GITHUB_OUTPUT"
      - name: Publish
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish
