# The macOS checks a machine can run, on the only kind of machine the release
# build runs on: the build is Apple silicon only and the Mac lane is Intel, so
# an arm64 runner is where the shipped architecture converts anything. This
# fetches the models, runs the suite (a scanned PDF through OCR among the demo
# documents), assembles the bundle with the private-symbol check, opens it with
# a document, and asks the window server whether a window appeared. It does not
# reach the sandbox, the folder panel, the icon, or the Store package.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: macos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release event is what builds the binary the Mac signs. A person's
  # token creates the release, so the event fires.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # Optional, because a screenshots run has no tag to give. With one the
      # release binary is built and attached; without one this is the checks
      # and, if asked for, the pictures.
      tag:
        description: 'Tag to build the release binary for'
        required: false
        type: string
      # A choice rather than a boolean, because there is a third thing to ask
      # for: `reference` takes the one plain frame per language that a
      # coordinate gets measured off, and `full` takes the set.
      screenshots:
        description: 'Mac App Store screenshots'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'reference', 'full']
      shot_args:
        description: 'Further arguments for shots.sh'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  # Keyed by the tag when this is releasing and by the ref when it is
  # checking: github.ref is refs/heads/main for a workflow_dispatch too.
  group: macos-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  arm64:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      # `macos-13` is Intel and `macos-14` onwards is Apple silicon, a mapping
      # GitHub can change, so the architecture is checked rather than assumed.
      - name: The runner is Apple silicon
        run: |
          arch=$(uname -m)
          echo "runner reports ${arch}"
          [ "$arch" = arm64 ] || {
            echo "this workflow exists to run the arm64 build and the runner is ${arch}" >&2
            exit 1
          }

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Keyed on the fetch script, which is where every pin lives.
      - name: The models, cached by their pins
        uses: actions/cache@v6
        with:
          path: |
            .models
            .pdfium
          key: models-${{ runner.os }}-${{ hashFiles('packaging/fetch-models.sh') }}

      - name: Fetch and verify the models
        run: ./packaging/fetch-models.sh

      - name: What is installed
        run: rustc -V && cargo -V && sw_vers && xcodebuild -version | head -1

      # `ort` downloads its prebuilt ONNX Runtime here and `onig_sys` compiles
      # oniguruma. The deployment target is the bundle's floor.
      - name: Build
        run: cargo build --all-targets
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.4"

      # The demo documents go through the worker here, models and all.
      - name: Test
        run: cargo test
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.4"

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --check

      # `build-app.sh` holds the private-symbol check. The debug binary, since
      # the symbol table asked about is the same either way.
      - name: Assemble the bundle, and no private symbol is in it
        run: |
          target=$(cargo metadata --format-version 1 --no-deps |
              sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          ./packaging/macos/build-app.sh --binary "${target}/debug/duckling"
          du -sh dist/Duckling.app
          lipo -archs dist/Duckling.app/Contents/MacOS/duckling
          ls dist/Duckling.app/Contents/Frameworks dist/Duckling.app/Contents/Resources

      # Duckling claims no document type here, so `open --args` is the one
      # launch path. The window server is asked rather than a screenshot taken;
      # `packaging/macos/window-probe.swift` says why.
      - name: A document opens, and a window appears
        run: |
          swiftc -O packaging/macos/window-probe.swift -o "${RUNNER_TEMP}/window-probe"
          open -a "$PWD/dist/Duckling.app" --args "$PWD/packaging/demo/documents/field-notes.docx"

          # Cold launch, a window server, and a first frame. Polled rather than
          # slept at, so a fast answer is fast and a slow one still gets its
          # chance.
          for _ in $(seq 1 15); do
            sleep 2
            "${RUNNER_TEMP}/window-probe" Duckling >/dev/null 2>&1 && break
          done

          set +e
          "${RUNNER_TEMP}/window-probe" Duckling
          verdict=$?
          set -e
          case "$verdict" in
            0) echo "the arm64 bundle drew a window" ;;
            2)
              echo "::error::The window server listed nothing, so this run answered nothing about the window. Decide whether this runner can host one at all before trusting a green tick here."
              exit 1
              ;;
            *)
              echo "::error::No window appeared for the arm64 bundle launched with a document."
              exit 1
              ;;
          esac

      # For eyes, not for the verdict.
      - name: Photograph it, for a person
        if: always()
        run: |
          screencapture -x "${RUNNER_TEMP}/screen.png" || true
          ls -l "${RUNNER_TEMP}/screen.png" || true

      - name: Keep the photograph
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-window
          path: ${{ runner.temp }}/screen.png
          if-no-files-found: warn

      # The Mac App Store set, off unless asked for. A bug fix should not pay
      # for a set of screenshots, and a set nobody asked for is a set nobody
      # looks at. `packaging/macos/shots.sh` carries the recipes; everything
      # around it - raising the desktop past the 1024x768 a runner comes up at,
      # running the recipes once per language, keeping what they wrote - is the
      # shared action's.
      #
      # Both languages. Duckling reads POTEXT_LANG before it asks the platform,
      # so the German set is a German window, and the demo documents are the
      # same in both.
      - name: The Store screenshots
        if: inputs.screenshots && inputs.screenshots != 'no'
        uses: excelano/.github/.github/actions/mac-store-screenshots@main
        with:
          app: dist/Duckling.app
          mode: ${{ inputs.screenshots }}
          languages: en de
          args: ${{ inputs.shot_args }}

      # Built here and signed on the Mac: the Distribution certificate stays
      # where it is, and the slow half plus the two checks that cost a review
      # cycle happen before anybody is waiting. The steps are excelano/.github's,
      # because every repository with this target needs the same ones.
      - name: The binary the Store package is built from
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: excelano/.github/.github/actions/mac-release-binary@main
        with:
          binary: duckling
          targets: aarch64-apple-darwin
          tag: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
