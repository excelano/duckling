# The macOS checks a machine can run, on the only kind of machine the release
# build runs on: the build is Apple silicon only and the Mac lane is Intel, so
# an arm64 runner is where the shipped architecture converts anything. This
# fetches the models, runs the suite (the demo documents, a scanned PDF through
# OCR among them), assembles the bundle with the private-symbol check, opens it
# with a document, and asks the window server whether a window appeared. It
# does not reach the sandbox, the folder panel, the icon as a person sees it, or
# the Store package; `CHECKLIST.md` holds those.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: macos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      # `macos-13` is Intel and `macos-14` onwards is Apple silicon, a mapping
      # GitHub can change, so the architecture is checked rather than assumed.
      - name: The runner is Apple silicon
        run: |
          arch=$(uname -m)
          echo "runner reports ${arch}"
          [ "$arch" = arm64 ] || {
            echo "this workflow exists to run the arm64 build and the runner is ${arch}" >&2
            exit 1
          }

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Keyed on the fetch script, which is where every pin lives.
      - name: The models, cached by their pins
        uses: actions/cache@v6
        with:
          path: |
            .models
            .pdfium
          key: models-${{ runner.os }}-${{ hashFiles('packaging/fetch-models.sh') }}

      - name: Fetch and verify the models
        run: ./packaging/fetch-models.sh

      - name: What is installed
        run: rustc -V && cargo -V && sw_vers && xcodebuild -version | head -1

      # `ort` downloads its prebuilt ONNX Runtime here and `onig_sys` compiles
      # oniguruma. The deployment target is the bundle's floor.
      - name: Build
        run: cargo build --all-targets
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.4"

      # The demo documents go through the worker here, models and all.
      - name: Test
        run: cargo test
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.4"

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --check

      # `build-app.sh` holds the private-symbol check. The debug binary, since
      # the symbol table asked about is the same either way.
      - name: Assemble the bundle, and no private symbol is in it
        run: |
          target=$(cargo metadata --format-version 1 --no-deps |
              sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          ./packaging/macos/build-app.sh --binary "${target}/debug/duckling"
          du -sh dist/Duckling.app
          lipo -archs dist/Duckling.app/Contents/MacOS/duckling
          ls dist/Duckling.app/Contents/Frameworks dist/Duckling.app/Contents/Resources

      # Duckling claims no document type here, so `open --args` is the one
      # launch path. The window server is asked rather than a screenshot taken;
      # `packaging/macos/window-probe.swift` says why.
      - name: A document opens, and a window appears
        run: |
          swiftc -O packaging/macos/window-probe.swift -o "${RUNNER_TEMP}/window-probe"
          open -a "$PWD/dist/Duckling.app" --args "$PWD/packaging/demo/documents/field-notes.docx"

          # Cold launch, a window server, and a first frame. Polled rather than
          # slept at, so a fast answer is fast and a slow one still gets its
          # chance.
          for _ in $(seq 1 15); do
            sleep 2
            "${RUNNER_TEMP}/window-probe" Duckling >/dev/null 2>&1 && break
          done

          set +e
          "${RUNNER_TEMP}/window-probe" Duckling
          verdict=$?
          set -e
          case "$verdict" in
            0) echo "the arm64 bundle drew a window" ;;
            2)
              echo "::error::The window server listed nothing, so this run answered nothing about the window. Decide whether this runner can host one at all before trusting a green tick here."
              exit 1
              ;;
            *)
              echo "::error::No window appeared for the arm64 bundle launched with a document."
              exit 1
              ;;
          esac

      # For eyes, not for the verdict.
      - name: Photograph it, for a person
        if: always()
        run: |
          screencapture -x "${RUNNER_TEMP}/screen.png" || true
          ls -l "${RUNNER_TEMP}/screen.png" || true

      - name: Keep the photograph
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arm64-window
          path: ${{ runner.temp }}/screen.png
          if-no-files-found: warn
