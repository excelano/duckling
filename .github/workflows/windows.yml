# Run the suite on Windows, check the things only a Windows machine can say,
# and assemble the Store package, attaching it to a published release. The
# checks themselves live in excelano/.github so every desktop-app repo in the
# fleet runs the same ones and a correction reaches all of them at once; what
# stays here is this product's own names, paths, its ONNX Runtime build cache
# and the OCR models it fetches for packaging.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release event is what attaches the package.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      # Optional: a screenshots run has no tag to give. With one the package is
      # attached to that release; without one it is built and kept as an
      # artefact.
      tag:
        description: 'Tag to attach the Store package to'
        required: false
        type: string
      screenshots:
        description: 'Store screenshots'
        required: false
        default: 'reference'
        type: choice
        options: ['no', 'reference', 'full']
      # Two of this repository's coordinates are inside the format list, which
      # is a popup, so the frame they are measured off is taken with
      # `-ListOpen`. Nothing else is passed here.
      shot_args:
        description: 'Further arguments for shots.ps1, such as -ListOpen'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  windows:
    uses: excelano/.github/.github/workflows/windows-desktop-ci.yml@main
    with:
      tag: ${{ inputs.tag }}
      binary-names: duckling
      install-rust: true
      # `ORT_CACHE_DIR` is set in `.cargo/config.toml`, not here - a relative
      # path Cargo resolves the same way on every platform. This just tells
      # the Rust build cache to save that directory alongside target/, in the
      # same cache entry, so a restored build and the runtime it was linked
      # against always arrive together or not at all.
      rust-cache-directories: .ort
      rust-cache-env-vars: ORT
      gui-subsystem-check: true
      icon-check: true
      icon-check-paths: 'packaging/windows/duckling.ico packaging/windows/assets packaging/windows/listing'
      # Duckling claims no file type, so there is no association to install.
      # The three lists of shipped DLLs agree - check-imports.ps1,
      # runtime-files.ps1 and uninstall.ps1 - because a set that differed
      # between any two is an application that starts one way and not another.
      extra-verify-script: |
        function Names($path, $pattern) {
          (Select-String -Path $path -Pattern $pattern -AllMatches).Matches |
            ForEach-Object { $_.Value.ToLowerInvariant() } | Sort-Object -Unique
        }
        $dll = "(?i)\b(vcruntime140(_1)?|msvcp140(_1)?|directml)\.dll\b"
        $check   = Names 'packaging/windows/check-imports.ps1' $dll
        $runtime = Names 'packaging/windows/runtime-files.ps1' $dll
        $remove  = Names 'packaging/windows/uninstall.ps1' $dll
        Write-Host "check-imports:  $($check -join ', ')"
        Write-Host "runtime-files:  $($runtime -join ', ')"
        Write-Host "uninstall:      $($remove -join ', ')"
        if (Compare-Object $check $runtime) { throw 'check-imports.ps1 and runtime-files.ps1 name different DLLs' }
        if (Compare-Object $check $remove)  { throw 'check-imports.ps1 and uninstall.ps1 name different DLLs' }
        Write-Host 'all three name the same five'
      # 500 MB, and the only thing here that wants them: the second frame is
      # scanned-notice.pdf converted, which is the offline-OCR claim
      # photographed, and install.ps1 refuses without them. Keyed on the fetch
      # script, which is where every pin lives, the way the Linux and macOS
      # lanes key theirs.
      extra-cache-paths: |
        .models
        .pdfium
      extra-cache-key-file: packaging/fetch-models.sh
      extra-cache-fetch-script: ./packaging/fetch-models.sh
      # The packaged build cannot be assembled here without an identity, so
      # the frames are of the side-loaded one - the same commit, and the
      # difference is the package around it.
      pre-screenshot-script: powershell -ExecutionPolicy Bypass -File packaging/windows/install.ps1
      screenshots: ${{ inputs.screenshots }}
      shot-args: -SideLoaded ${{ inputs.shot_args }}
    secrets: inherit
