# Build the Linux package on every push and put it under the checks a machine
# can run: ownership and modes, md5sums, lintian, and the desktop entry through
# GLib; the suite, clippy and formatting are the fleet's `ci.yml`. On a
# published release the package goes straight to the release page from the job
# that built it, never through an artifact. Nothing here reaches a window:
# `check-libraries.sh` and `CHECKLIST.md` are commands run by a person with a
# display. amd64 only: `fetch-models.sh` pins no arm64 pdfium.
#
# Author: David M. Anderson
# Built with AI assistance (Claude, Anthropic)

name: linux

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A release created by a workflow with the default GITHUB_TOKEN fires no
  # event at all, so the dispatch below is the fallback for that case.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build the package for (e.g. v0.1.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Keyed by the tag when releasing and by the ref when checking, so the two
  # never share a group: `github.ref` is refs/heads/main for a dispatch too.
  group: linux-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  # A superseded check is cancelled; a half-built release is not.
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: ubuntu-latest
    # For the release upload step alone; an artifact and a second job would
    # push most of a gigabyte twice to keep the token narrower.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      # Keyed on the fetch script, where every pin lives; a hit is verified again.
      - name: The models, cached by their pins
        uses: actions/cache@v6
        with:
          path: |
            .models
            .pdfium
          key: models-${{ runner.os }}-${{ hashFiles('packaging/fetch-models.sh') }}

      - name: Fetch and verify the models
        run: ./packaging/fetch-models.sh

      - name: What is installed
        run: rustc -V && cargo -V && python3 -V && dpkg-deb --version | head -1

      # What the executable links at load time, recorded and bounded. The C
      # this repository takes is stated in DESIGN.md §2; anything beyond
      # libstdc++ here is a dependency that section does not know about.
      - name: Build, and what it links
        run: |
          cargo build --release
          target=$(cargo metadata --format-version 1 --no-deps |
              sed -n 's/.*"target_directory":"\([^"]*\)".*/\1/p')
          # The dynamic loader is named for the architecture and lives in a
          # different directory on each: /lib64/ld-linux-x86-64.so.2 on amd64,
          # /lib/ld-linux-aarch64.so.1 on arm64. The allowlist had the amd64
          # path alone, so the first arm64 run reported the loader itself as an
          # unexpected library — on a binary that links libc, libgcc and libm
          # and nothing else, which is the answer this step wanted.
          echo "linked at load time:"
          ldd "${target}/release/duckling" | sed 's/^/  /'
          strange=$(ldd "${target}/release/duckling" |
              awk '{print $1}' | grep -vE '^(linux-vdso|libgcc_s|libm|libc|libstdc\+\+|/lib(64)?/ld-linux)' || true)
          [ -z "$strange" ] || { echo "unexpected shared libraries:"; echo "$strange"; exit 1; }

      - name: Build the package
        run: ./packaging/debian/build-deb.sh

      - name: The package holds up
        run: |
          deb=$(ls dist/*.deb)
          echo "checking ${deb} ($(du -h "$deb" | cut -f1))"

          strange=$(dpkg-deb --contents "$deb" | awk '$2 != "root/root"')
          [ -z "$strange" ] || { echo "not root/root:"; echo "$strange"; exit 1; }

          strange=$(dpkg-deb --contents "$deb" |
              awk '$1 !~ /^drwxr-xr-x/ && $1 !~ /^-rw-r--r--/ && $1 !~ /^-rwxr-xr-x/ && $1 !~ /^lrwxrwxrwx/')
          [ -z "$strange" ] || { echo "unexpected modes:"; echo "$strange"; exit 1; }

          dpkg-deb --ctrl-tarfile "$deb" | tar t | grep -qx './md5sums' ||
              { echo "the package ships no md5sums" >&2; exit 1; }

          tree="${RUNNER_TEMP}/tree"
          dpkg-deb -x "$deb" "$tree"
          dpkg-deb -e "$deb" "${tree}/DEBIAN"
          ( cd "$tree" && md5sum -c DEBIAN/md5sums --quiet )

      - name: What lintian says
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lintian
          lintian --info --tag-display-limit 0 --fail-on error,warning dist/*.deb

      # GLib drops an entry whose Exec is not on PATH, so the executable is
      # installed first.
      - name: The entry is ours and lists the types
        run: |
          sudo apt-get install -y -qq desktop-file-utils hicolor-icon-theme libglib2.0-bin
          ./packaging/linux/install.sh
          export PATH="${HOME}/.local/bin:${PATH}"
          desktop-file-validate ~/.local/share/applications/duckling.desktop
          for type in application/pdf application/vnd.openxmlformats-officedocument.wordprocessingml.document; do
              echo "${type}:"
              gio mime "$type" | sed 's/^/  /'
              gio mime "$type" | grep -q 'duckling.desktop' ||
                  { echo "duckling.desktop is not among the handlers for ${type}" >&2; exit 1; }
          done

      # Last, because it installs system-wide and the step above asks GLib which
      # handlers are registered. The executable opens a window from `main`, so
      # without a display the question is only whether the loader takes it,
      # read from how it fails rather than whether it does.
      - name: It installs, and the executable loads
        run: |
          set -eu
          deb=$(ls dist/*.deb)
          sudo apt-get install -y "./${deb#./}"

          command -v duckling
          file -L "$(command -v duckling)"

          missing=$(ldd "$(command -v duckling)" | grep 'not found' || true)
          [ -z "$missing" ] || { echo "the package installed but does not resolve:"; echo "$missing"; exit 1; }

          out=$(timeout 30 duckling 2>&1 || true)
          printf '%s\n' "$out" | sed 's/^/  /'
          case "$out" in
              *'error while loading shared libraries'*)
                  echo "the loader refused the executable" >&2; exit 1 ;;
              *'cannot execute binary file'*|*'Exec format error'*)
                  echo "the executable is not this machine's architecture" >&2; exit 1 ;;
          esac

      # Straight to the release from the job that built it. `--clobber` so a
      # dispatched re-run replaces the package rather than refusing.
      - name: Attach the package to the release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          ls -l dist/*.deb
          gh release upload \
            "${{ github.event.release.tag_name || inputs.tag }}" \
            dist/*.deb --clobber
