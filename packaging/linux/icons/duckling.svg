<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <clipPath id="rounded"><rect width="64" height="64" rx="14.317"/></clipPath>
  <g clip-path="url(#rounded)">
  <!--
    Duckling: a duckling on a blue square. Body and head as one yellow
    shape, an orange bill, a dark eye.

    Author: David M. Anderson
    Built with AI assistance (Claude, Anthropic)

    Drawn 2026-09-04 as one of three on a sheet: a duckling in profile with
    body, head and tail as separate shapes; a head alone with the bill; and
    this, the rubber-duck silhouette. The profile lost its head at 16
    pixels and the head alone read as a ball with a beak; this one keeps
    the duck at 16, 32 and 128 on light and dark. David chose it from the
    sheet on 2026-09-05, and then asked the right question: shouldn't a
    rubber duck be yellow? It was cream to match its siblings, and beside
    a yellow one it read as a goose. Warm yellow over bright, because the
    bright one glows on a dark ground and the warm one sits with the
    ochre the fleet already uses.

    This comment sits inside the element rather than above it, and that is
    a measurement rather than a style: gdk-pixbuf sniffs the first 256
    bytes for `<svg` and refuses the file when the tag comes later, which
    is what a header comment above the tag does. slipcase-desktop found it
    the hard way. Keep the opening tag on the second line.

    Filled shapes and no strokes at all, which is what still reads at 16
    pixels. The tile is slipcase-desktop's blue and the eye its dark, so
    the Excelano applications share a palette on a launcher; the duck is
    the one thing on it that is not the sibling palette, on purpose.

    A plain square, full bleed and unframed: a store takes a square and
    applies its own corner rounding, so a drawing that carries its own
    smaller shape or its own outline into that frame is a sticker on a
    tile. The blue reaches all four edges and nothing is drawn around it.
  -->
  <rect width="64" height="64" fill="#4a6fa5"/>
  <!-- Body and head, one silhouette: the breast rises into the neck at the
       left, the head is the dome at the top right, the tail is the rise at
       the left. -->
  <path d="M10 36 Q8 28 16 28 L24 28 Q24 16 34 16 Q44 16 44 26 L44 30 Q52 32 50 40 Q48 48 34 48 L20 48 Q10 48 10 36 z" fill="#f5c542"/>
  <!-- The bill. -->
  <path d="M44 22 L56 25 L44 29 z" fill="#e0782a"/>
  <!-- The eye. -->
  <circle cx="38" cy="23" r="2.4" fill="#2f3337"/>
</g>
</svg>
