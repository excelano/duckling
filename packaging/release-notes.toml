# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.

version = "0.6.1"

[locales."de-de"]
whats-new = """
Dokumente liest jetzt docling.rs 2.85, das PDFs genauer liest: Text in Symbol-, ZapfDingbats- und TeX-Mathematikschriften kommt als die Zeichen heraus, die auf der Seite stehen, eine Tabelle, deren Zellen keine Textebene haben, bleibt mit ihrer Beschriftung erhalten, und Kontrollkästchen werden von umrahmten Buchstaben und Ziffern unterschieden.

Die Pakete enthalten jetzt die Lizenzen des fremden Codes und der Daten, aus denen Duckling gebaut ist.
"""

[locales."en-us"]
whats-new = """
Documents are now read by docling.rs 2.85, which reads PDFs more faithfully: text in Symbol, ZapfDingbats and TeX math fonts comes out as the characters on the page, a table whose cells have no text layer is kept with its caption, and checkboxes are told apart from boxed letters and digits.

The packages now include the licenses of the third-party code and data Duckling is built from.
"""
