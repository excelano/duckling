# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.

version = "0.6.0"

[locales."de-de"]
whats-new = """
Sicherheitsversion: Eine präparierte Excel-Datei im alten .xls- oder im .xlsb-Format konnte Duckling zum Absturz bringen oder den gesamten Arbeitsspeicher belegen. Die Tabellenbibliothek, mit der Duckling diese Dateien liest, schließt diese Lücke (RUSTSEC-2026-0436).

Dokumente liest jetzt docling.rs 2.80. Duckling öffnet jetzt auch Numbers-Tabellen, iCalendar-Dateien, Box Notes und AFP-Druckdateien. PDFs kommen in besserer Lesereihenfolge heraus, chinesische, japanische und koreanische Schriften ohne Zuordnungstabelle werden gelesen, und eine gescannte Seite unter einer unvollständigen Textebene wird erkannt.

Unter Windows lädt Duckling die installierten Vulkan-Treiber nicht mehr, an denen es auf manchen Rechnern mit Intel-Grafik beim Start abstürzen konnte.
"""

[locales."en-us"]
whats-new = """
Security release: a crafted Excel file in the old .xls format or in .xlsb could crash Duckling or exhaust its memory. The spreadsheet library Duckling reads those files with closes the hole (RUSTSEC-2026-0436).

Documents are now read by docling.rs 2.80. Duckling now also opens Numbers spreadsheets, iCalendar files, Box Notes and AFP print files. PDFs come out in a better reading order, Chinese, Japanese and Korean fonts without a mapping table are read, and a scanned page under an incomplete text layer is recognized.

On Windows, Duckling no longer loads the installed Vulkan drivers, which could crash it at launch on some PCs with Intel graphics.
"""
