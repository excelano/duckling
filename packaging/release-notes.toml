# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.

version = "0.5.0"

[locales."de-de"]
whats-new = """
Sicherheitsversion: Die ZIP-Bibliothek, mit der Duckling Word-, Excel-, PowerPoint- und OpenDocument-Dateien liest, schließt eine kritische und vier weitere Sicherheitslücken beim Lesen von Archiven (GHSA-m665-v7pm-7grj, GHSA-9hj8-73fh-9963, GHSA-hjqx-j4rw-g7xv, GHSA-q7v9-x93c-xqv3, GHSA-8hxf-qr8p-62x4).

Dokumente liest jetzt docling.rs 2.65. Formen und Textfelder in einem Word-Dokument kommen jetzt als gezeichnete Bilder heraus.
"""

[locales."en-us"]
whats-new = """
Security release: the ZIP library Duckling reads Word, Excel, PowerPoint and OpenDocument files with fixes one critical and four further vulnerabilities in archive reading (GHSA-m665-v7pm-7grj, GHSA-9hj8-73fh-9963, GHSA-hjqx-j4rw-g7xv, GHSA-q7v9-x93c-xqv3, GHSA-8hxf-qr8p-62x4).

Documents are now read by docling.rs 2.65. Shapes and text boxes in a Word document now come through as drawn pictures.
"""
