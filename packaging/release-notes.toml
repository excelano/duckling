# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.

version = "0.4.0"

[locales."de-de"]
whats-new = """
Das Kästchen „Nur Textebene“ heißt jetzt „Textebene bevorzugen“. Ein PDF, das bereits Text enthält, wird weiterhin in Sekunden aus seiner Textebene gelesen. Ein gescanntes PDF kommt jetzt durch die Texterkennung, statt leer zurückzukommen.

Dokumente liest jetzt docling.rs 2.49. Bildunterschriften in PDFs stehen öfter beim richtigen Bild und an der richtigen Stelle im Text. Die DocLang-Ausgabe ordnet Bildunterschriften so, wie es die Spezifikation verlangt. ODT und DOCX behalten die Größe, in der ein Bild in einer Word- oder Writer-Vorlage angezeigt wurde.
"""

[locales."en-us"]
whats-new = """
The Text layer only box is now Text layer when present. A PDF that already has text in it is still read from its text layer in seconds, and a scanned PDF now goes through OCR instead of coming back empty.

Documents are now read by docling.rs 2.49. Captions in a PDF more often attach to the right picture and sit in the right place in the text. DocLang output orders captions as the specification asks. ODT and DOCX output keeps the size a picture was shown at in a Word or Writer source.
"""
