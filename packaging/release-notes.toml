# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.

version = "0.2.2"

[locales."de-de"]
whats-new = """
Die Installation ist etwa halb so groß: rund 300 MB statt 602 MB.

Drei Dinge sind entfallen. Eine zweite Kopie des Layout-Modells in voller Genauigkeit, die als Absicherung mitgeliefert wurde und über die 2.018 Seiten des Testbestands von docling.rs kein einziges Mal gebraucht wurde. Die PDF-Bibliothek zum Darstellen von Seiten, weil docling.rs Seiten jetzt selbst zeichnet. Und gut die Hälfte des Platzes der Tabellenmodelle, die jetzt in geringerer Genauigkeit gespeichert sind: Über denselben Bestand und ein Buch mit 1.913 Seiten werden Tabellen unverändert konvertiert, bis auf Leerraum in zwei Zeilen eines Inhaltsverzeichnisses.

Dokumente liest docling.rs 1.87.
"""

[locales."en-us"]
whats-new = """
The install is about half the size: around 300 MB now rather than 602 MB.

Three things came out. A second copy of the page-layout model, carried at full precision as a safeguard that was never once needed over the 2,018 pages of docling.rs's test corpus. The PDF library that drew pages, because docling.rs now draws them itself. And a little over half the space of the table-reading models, which are now stored at reduced precision: over the same corpus and a 1,913-page book, tables convert exactly as before, apart from spacing in two rows of one table of contents.

Documents are read by docling.rs 1.87.
"""
