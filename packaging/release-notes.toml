# What this release tells the stores it changed, in every language the
# listing is in. One file, both languages, because a translation is reviewed
# beside its source.
#
# The version is checked against the release being cut: notes left from last
# time stop the release rather than reaching a listing. A language the listing
# has and this file does not is also a refusal - a German listing saying
# something nobody wrote is worse than a release that stops.
#
# Nothing else reads this. The GitHub release, the Debian changelog and the
# AppStream entry take commit subjects.

version = "0.2.2"

[locales."de-de"]
whats-new = """
Der Download ist rund 172 MB kleiner: Die Installation belegt jetzt etwa 430 MB statt 602 MB.

Entfallen ist eine zweite Kopie des Layout-Modells, die in voller Genauigkeit mitgeliefert wurde, damit eine Seite, deren erster Durchgang unstimmig aussah, noch einmal gelesen werden konnte. Über den gesamten Testbestand von docling.rs - 2.018 Seiten - wurde sie kein einziges Mal gebraucht. Was dieser Bestand abdeckt, wird unverändert konvertiert.

Dokumente liest docling.rs 1.51.
"""

[locales."en-us"]
whats-new = """
The download is about 172 MB smaller: the install is around 430 MB now rather than 602 MB.

What came out is a second copy of the page-layout model, carried at full precision so that a page whose first pass looked wrong could be read again. Over the whole of docling.rs's test corpus - 2,018 pages - it was never once needed. Everything that corpus covers converts exactly as it did.

Documents are read by docling.rs 1.51.
"""
